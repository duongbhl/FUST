<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản đồ địa điểm ăn uống - FUST</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        :root {
            --primary: #ff4757;
            --primary-hover: #ff6b81;
            --bg-dark: #1e272e;
            --bg-panel: rgba(30, 39, 46, 0.85);
            --text-light: #f1f2f6;
            --text-muted: #a4b0be;
            --border-color: rgba(255, 255, 255, 0.1);
            --radius: 16px;
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-light);
        }

        #map {
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            bottom: 0;
            z-index: 1;
        }

        /* Glassmorphism Controls Panel */
        .control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            width: 380px;
            max-width: calc(100% - 40px);
            background: var(--bg-panel);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: var(--transition);
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .panel-header i {
            font-size: 24px;
            color: var(--primary);
        }

        .panel-header h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .search-container {
            position: relative;
            display: flex;
            gap: 8px;
        }

        .search-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text-light);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }

        .search-input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(255, 71, 87, 0.2);
        }

        .search-btn {
            background: var(--primary);
            border: none;
            border-radius: 12px;
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            transition: var(--transition);
        }

        .search-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        /* Suggestions dropdown */
        .suggestions {
            position: absolute;
            top: 52px;
            left: 0;
            right: 0;
            background: #2f3640;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            max-height: 200px;
            overflow-y: auto;
            z-index: 1001;
            box-shadow: var(--shadow);
            display: none;
        }

        .suggestion-item {
            padding: 12px 16px;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: var(--transition);
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--primary);
        }

        .info-box {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
            font-weight: 600;
        }

        .info-value-editable {
            background: transparent;
            border: none;
            color: var(--text-light);
            font-size: 14px;
            font-weight: 500;
            line-height: 1.5;
            width: 100%;
            outline: none;
            resize: none;
            margin-top: 4px;
        }

        .confirm-btn {
            width: 100%;
            background: var(--primary);
            border: none;
            border-radius: 12px;
            padding: 14px;
            color: white;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition);
        }

        .confirm-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
        }

        .confirm-btn:active {
            transform: translateY(0);
        }

        /* Leaflet controls custom styles */
        .leaflet-bar {
            border: 1px solid var(--border-color) !important;
            box-shadow: var(--shadow) !important;
            border-radius: 12px !important;
            overflow: hidden;
        }

        .leaflet-bar a {
            background-color: var(--bg-panel) !important;
            color: var(--text-light) !important;
            border-bottom: 1px solid var(--border-color) !important;
            transition: var(--transition);
        }

        .leaflet-bar a:hover {
            background-color: var(--bg-dark) !important;
            color: var(--primary) !important;
        }

        .leaflet-container {
            background: var(--bg-dark) !important;
        }

        /* Custom Popup styling */
        .leaflet-popup-content-wrapper {
            background: var(--bg-panel) !important;
            color: var(--text-light) !important;
            border: 1px solid var(--border-color) !important;
            backdrop-filter: blur(12px);
            border-radius: 12px !important;
            box-shadow: var(--shadow) !important;
        }

        .leaflet-popup-tip {
            background: var(--bg-panel) !important;
            border: 1px solid var(--border-color) !important;
        }

        .popup-title {
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .popup-desc {
            font-size: 12px;
            line-height: 1.4;
            color: var(--text-light);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .control-panel {
                top: auto;
                bottom: 20px;
                left: 10px;
                right: 10px;
                width: calc(100% - 20px);
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="control-panel" id="panel">
        <div class="panel-header">
            <i class="fa-solid fa-map-location-dot"></i>
            <h1 id="panel-title">Chọn vị trí nhà hàng</h1>
        </div>

        <div class="search-container" id="search-box">
            <input type="text" id="search-input" class="search-input" placeholder="Tìm kiếm địa chỉ tại Hà Nội...">
            <button class="search-btn" id="search-btn">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
            <div class="suggestions" id="suggestions"></div>
        </div>

        <!-- Tên nhà hàng -->
        <div class="form-group" id="name-group">
            <label class="info-label" for="restaurant-name"><i class="fa-solid fa-store"></i> Tên nhà hàng</label>
            <input type="text" id="restaurant-name" class="search-input" placeholder="Nhập tên nhà hàng (không bắt buộc)..." style="width: 100%;">
        </div>

        <!-- Đánh giá sao -->
        <div class="form-group" id="rating-group">
            <label class="info-label"><i class="fa-solid fa-star"></i> Đánh giá</label>
            <div class="rating-stars" id="rating-stars" style="display: flex; gap: 8px; font-size: 24px; color: var(--text-muted); cursor: pointer;">
                <i class="fa-regular fa-star" data-value="1"></i>
                <i class="fa-regular fa-star" data-value="2"></i>
                <i class="fa-regular fa-star" data-value="3"></i>
                <i class="fa-regular fa-star" data-value="4"></i>
                <i class="fa-regular fa-star" data-value="5"></i>
            </div>
        </div>

        <!-- Địa chỉ (Cho phép chỉnh sửa trực tiếp) -->
        <div class="info-box">
            <div class="info-label"><i class="fa-solid fa-location-dot"></i> Địa chỉ nhà hàng</div>
            <textarea id="location-address" class="info-value-editable" rows="2" placeholder="Click vào bản đồ hoặc tự nhập địa chỉ tại đây..."></textarea>
        </div>

        <button class="confirm-btn" id="confirm-btn">
            <i class="fa-solid fa-circle-check"></i> Xác nhận và Chèn thông tin
        </button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // --- XSS PROTECTION HELPER ---
        function escapeHtml(text) {
            if (!text) return "";
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // --- CẤU HÌNH GIỚI HẠN KHU VỰC BẢN ĐỒ ---
        const REGION_BOUNDS = L.latLngBounds(
            [20.70, 105.40], // SW corner
            [21.40, 106.10]  // NE corner
        );

        const DEFAULT_CENTER = [21.0285, 105.8542]; // Tọa độ trung tâm (Hà Nội)
        const MIN_ZOOM = 10;
        const MAX_ZOOM = 18;
        
        const map = L.map('map', {
            center: DEFAULT_CENTER,
            zoom: 13,
            minZoom: MIN_ZOOM,
            maxZoom: MAX_ZOOM,
            maxBounds: REGION_BOUNDS,
            maxBoundsViscosity: 1.0
        });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        let selectedMarker = null;
        let currentLatLng = null;
        let currentRating = 0;

        // Đọc tham số từ URL
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode');
        const paramLat = parseFloat(urlParams.get('lat'));
        const paramLng = parseFloat(urlParams.get('lng'));
        const paramAddress = urlParams.get('address');
        const paramName = urlParams.get('name');
        const paramRating = parseInt(urlParams.get('rating'));

        const isPickMode = (mode === 'pick');

        // Giao diện sao tương tác
        const stars = document.querySelectorAll('#rating-stars i');
        if (isPickMode) {
            stars.forEach(star => {
                star.addEventListener('mouseover', function() {
                    const value = parseInt(this.getAttribute('data-value'));
                    highlightStars(value);
                });

                star.addEventListener('mouseout', function() {
                    highlightStars(currentRating);
                });

                star.addEventListener('click', function() {
                    currentRating = parseInt(this.getAttribute('data-value'));
                    highlightStars(currentRating);
                });
            });
        }

        function highlightStars(count) {
            stars.forEach((star, index) => {
                if (index < count) {
                    star.className = 'fa-solid fa-star';
                    star.style.color = '#ffb300';
                } else {
                    star.className = 'fa-regular fa-star';
                    star.style.color = 'var(--text-muted)';
                }
            });
        }

        // Điều chỉnh giao diện dựa trên chế độ (Xem / Chọn)
        if (!isPickMode) {
            document.getElementById('panel-title').innerText = "Thông tin địa điểm";
            document.getElementById('search-box').style.display = "none";
            document.getElementById('confirm-btn').style.display = "none";
            document.getElementById('location-address').readOnly = true;

            if (paramName) {
                document.getElementById('restaurant-name').value = paramName;
                document.getElementById('restaurant-name').readOnly = true;
            } else {
                document.getElementById('name-group').style.display = "none";
            }

            if (!isNaN(paramRating) && paramRating >= 1 && paramRating <= 5) {
                highlightStars(paramRating);
                document.getElementById('rating-stars').style.pointerEvents = "none";
            } else {
                document.getElementById('rating-group').style.display = "none";
            }

            if (!isNaN(paramLat) && !isNaN(paramLng)) {
                const targetLatLng = L.latLng(paramLat, paramLng);
                
                // Nếu tọa độ xem nằm ngoài ranh giới giới hạn, tạm thời tắt giới hạn để hiển thị đúng vị trí
                if (!REGION_BOUNDS.contains(targetLatLng)) {
                    map.setMaxBounds(null);
                }
                
                setMarker(targetLatLng, paramAddress || "Địa điểm ăn uống");
                map.setView(targetLatLng, 16);
            } else {
                document.getElementById('location-address').value = "Không tìm thấy tọa độ địa điểm hợp lệ.";
            }
        } else {
            // Lắng nghe sự kiện click trên map để chọn điểm
            map.on('click', function(e) {
                if (REGION_BOUNDS.contains(e.latlng)) {
                    reverseGeocode(e.latlng);
                } else {
                    alert("Vui lòng chọn vị trí bên trong khu vực Hà Nội!");
                }
            });
        }

        function setMarker(latlng, addressText) {
            currentLatLng = latlng;
            document.getElementById('location-address').value = addressText;

            if (selectedMarker) {
                selectedMarker.setLatLng(latlng);
            } else {
                selectedMarker = L.marker(latlng, {
                    draggable: isPickMode
                }).addTo(map);

                if (isPickMode) {
                    selectedMarker.on('dragend', function(e) {
                        const markerLatLng = selectedMarker.getLatLng();
                        if (REGION_BOUNDS.contains(markerLatLng)) {
                            reverseGeocode(markerLatLng);
                        } else {
                            selectedMarker.setLatLng(currentLatLng);
                            alert("Không thể kéo marker ra ngoài khu vực Hà Nội!");
                        }
                    });
                }
            }

            const escapedAddress = escapeHtml(addressText);
            const popupContent = `
                <div class="popup-title"><i class="fa-solid fa-utensils"></i> Vị trí được chọn</div>
                <div class="popup-desc">${escapedAddress}</div>
            `;
            selectedMarker.bindPopup(popupContent).openPopup();
        }

        async function searchLocation(query) {
            if (!query.trim()) return;
            
            const viewbox = `${REGION_BOUNDS.getWest()},${REGION_BOUNDS.getSouth()},${REGION_BOUNDS.getEast()},${REGION_BOUNDS.getNorth()}`;
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&viewbox=${viewbox}&bounded=1&limit=5&accept-language=vi`;

            try {
                const response = await fetch(url, { headers: { 'User-Agent': 'FUST-Forum-Food-Map' } });
                const data = await response.json();
                
                const suggestionsContainer = document.getElementById('suggestions');
                suggestionsContainer.innerHTML = "";
                
                if (data.length === 0) {
                    suggestionsContainer.style.display = "none";
                    alert("Không tìm thấy địa điểm nào phù hợp trong khu vực giới hạn.");
                    return;
                }

                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.innerText = item.display_name;
                    div.onclick = function() {
                        const latlng = L.latLng(parseFloat(item.lat), parseFloat(item.lon));
                        setMarker(latlng, item.display_name);
                        map.setView(latlng, 16);
                        suggestionsContainer.style.display = "none";
                        document.getElementById('search-input').value = item.display_name;
                    };
                    suggestionsContainer.appendChild(div);
                });
                
                suggestionsContainer.style.display = "block";
            } catch (err) {
                console.error("Search error:", err);
            }
        }

        async function reverseGeocode(latlng) {
            const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latlng.lat}&lon=${latlng.lng}&zoom=18&addressdetails=1&accept-language=vi`;
            
            setMarker(latlng, "Đang lấy địa chỉ...");

            try {
                const response = await fetch(url, { headers: { 'User-Agent': 'FUST-Forum-Food-Map' } });
                const data = await response.json();
                const address = data.display_name || `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;
                setMarker(latlng, address);
            } catch (err) {
                console.error("Reverse geocode error:", err);
                setMarker(latlng, `Tọa độ: ${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`);
            }
        }

        document.getElementById('search-btn').onclick = function() {
            searchLocation(document.getElementById('search-input').value);
        };
        
        document.getElementById('search-input').onkeydown = function(e) {
            if (e.key === 'Enter') {
                searchLocation(this.value);
            }
        };

        document.addEventListener('click', function(e) {
            if (!document.getElementById('search-box').contains(e.target)) {
                document.getElementById('suggestions').style.display = "none";
            }
        });

        // Xác nhận chèn thông tin
        document.getElementById('confirm-btn').onclick = function() {
            const addressVal = document.getElementById('location-address').value.trim();
            const nameVal = document.getElementById('restaurant-name').value.trim();

            if (!currentLatLng) {
                alert("Vui lòng chọn một vị trí trên bản đồ bằng cách click vào bản đồ hoặc sử dụng ô tìm kiếm!");
                return;
            }

            if (!addressVal) {
                alert("Vui lòng nhập hoặc chọn một địa chỉ!");
                return;
            }

            if (window.opener) {
                window.opener.postMessage({
                    type: 'map-location-selected',
                    lat: currentLatLng.lat,
                    lng: currentLatLng.lng,
                    address: addressVal,
                    name: nameVal,
                    rating: currentRating
                }, window.location.origin);
                
                window.close();
            } else {
                alert("Không tìm thấy cửa sổ soạn thảo. Vui lòng mở lại bản đồ từ NodeBB.");
            }
        };
    </script>
</body>
</html>
