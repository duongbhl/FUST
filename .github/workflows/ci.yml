name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: food_review_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d food_review_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/food_review_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-minimum-24-chars
      JWT_REFRESH_SECRET: ci-refresh-secret-minimum-24-chars
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: npm install
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Run migrations
        working-directory: backend
        run: npx prisma migrate deploy
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Install frontend
        working-directory: frontend
        run: npm install
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Validate Docker Compose
        run: docker compose config
      - name: Deploy
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: echo "Configure Vercel/Railway/Render deploy hooks with repository secrets."
